<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The header mark, rebuilt for a 32px tab icon: same rounded-square badge and
    Lucide ShieldCheck as components/layout/app-shell.tsx.

    Two deliberate differences from the header, both for legibility at 16px:
    the badge is solid brand rather than a 12%-opacity tint (a tint on a
    transparent tab background is invisible), and the shield is filled rather
    than stroked, so it survives being scaled down to a favicon.
  -->
  <rect width="32" height="32" rx="8" fill="#4a7dff" />
  <g transform="translate(6 6) scale(0.833)">
    <path
      d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"
      fill="#0b0f1a"
    />
    <path
      d="m9 12 2 2 4-4"
      fill="none"
      stroke="#4a7dff"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
