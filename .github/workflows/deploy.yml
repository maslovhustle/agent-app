name: Deploy

# Deployment to Vercel — the ONLY path to an environment.
#
#   dev  -> preview  (staging URL, verify here before promoting)
#   main -> production
#
# Vercel's own Git integration deploys on push and does NOT wait for GitHub Actions,
# so leaving it enabled would let a red test suite reach production. `vercel.json`
# therefore disables Vercel's automatic deploys for both branches, and this workflow
# becomes the single gate: `needs: verify` means a failing typecheck, lint or test
# blocks the deploy.
#
# Required repository secrets:
#   VERCEL_TOKEN      — Vercel account settings → Tokens
#   VERCEL_ORG_ID     — from .vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID — from .vercel/project.json after `vercel link`
#
# Until those are set the deploy job skips, and nothing reaches any environment.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

# Keyed by branch so a dev preview and a production deploy never queue behind each
# other. cancel-in-progress stays false: half-finished deploys are worse than slow ones.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  SKIP_ENV_VALIDATION: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # GitHub Actions does not expose the `secrets` context to a job-level `if`, so the
  # "are we linked to Vercel yet?" check has to happen inside a step and be published
  # as a job output. Without this indirection the whole workflow fails to parse.
  preflight:
    name: Check deployment credentials
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] \
            && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] \
            && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel secrets not set — the deploy job will be skipped. Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID, or use Vercel's Git integration instead."
          fi

  verify:
    name: Verify before deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Version comes from package.json's "packageManager" field; passing it here too
      # makes the action fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  deploy:
    name: Deploy
    needs: [preflight, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skipped cleanly in forks and before the repo is linked to Vercel. Gating the
    # whole job (rather than adding an early-exit step) matters: a step that `exit 0`s
    # does not stop the steps after it, so the run would carry on and fail with an
    # opaque auth error instead of skipping.
    if: needs.preflight.outputs.configured == 'true'
    environment:
      # `main` is the protected production environment; `dev` gets a staging URL.
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's "packageManager" field; passing it here too
      # makes the action fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Vercel CLI
        run: pnpm add --global vercel@latest

      # `--prod` is added only on main. Everything downstream reads this one value,
      # so the branch-to-environment mapping lives in exactly one place.
      - name: Resolve target environment
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
            echo "env=production" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "env=preview" >> "$GITHUB_OUTPUT"
          fi

      # Vercel builds with the environment variables configured on the project, so
      # the real (non-placeholder) config lives in the Vercel dashboard, never here.
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ steps.target.outputs.env }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build ${{ steps.target.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.target.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed ${{ steps.target.outputs.env }} to $url"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
